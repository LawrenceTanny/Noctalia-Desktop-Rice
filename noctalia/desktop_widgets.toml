config_version = 15

[bar.default]
center = [ "cat", "clock", "cat_2" ]
end = [
    "media",
    "recorder",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
start = [ "launcher", "wallpaper", "wallhaven", "workspaces", "cpu", "ram", "temp", "theme_mode" ]

[battery]
warning_threshold = 40

    [battery.device."/org/freedesktop/UPower/devices/headset_dev_2C_97_20_16_E6_24"]
    warning_threshold = 50

[calendar]
enabled = true

