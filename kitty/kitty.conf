# --- GUWEIZ Aesthetic Terminal Rice ---

# --- Typography (JetBrains Mono Nerd Font) ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Ligatures (converts -> to arrow, != to not-equal, etc.)
disable_ligatures never

# --- Transparency & Glass Settings ---
background_opacity 0.75
background_blur 1

# --- Window Spacing ---
window_padding_width 14 18

include themes/noctalia.conf
